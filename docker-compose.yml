version: "3.9"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: divination-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
      - backend-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: divination-frontend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    networks:
      - frontend-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: divination-backend
    expose:
      - "8000"
    networks:
      - backend-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: divination-redis
    expose:
      - "6379"
    networks:
      - backend-net
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
