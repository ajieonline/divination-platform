services:
  backend:
    build: ./server
    container_name: divination-backend
    restart: always
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges:true
    volumes:
      - divination-data:/data
    networks:
      - divination-net

  frontend:
    build: ./client
    container_name: divination-frontend
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - divination-net

volumes:
  divination-data:

networks:
  divination-net:
    driver: bridge
